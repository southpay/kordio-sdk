                          $ref: '#/components/schemas/PaymentIntent'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/payment_intents/{id}:
    get:
      tags: [Approvals]
      operationId: getWorkspacePaymentIntent
      summary: Read a payment intent
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
