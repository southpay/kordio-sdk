      description: >-
        Resolve an invitation token before accepting it, so your UI can show what is being
        joined and whether the signed-in account matches.
      security:
        - IdentityToken: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The invitation preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspace_name: { type: string }
                      workspace_slug: { type: string }
                      email: { type: string }
                      role: { $ref: '#/components/schemas/Role' }
                      expires_at: { type: string, format: date-time }
                      signed_in_as: { type: string, nullable: true }
