              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/audit_events:
    get:
      tags: [Audit events]
      operationId: listAuditEvents
      summary: List audit events
      description: |
        The append-only record of everything the control layer did. Every role can read it,
        including `member`. An audit trail only some people can see is not much of one.

        Filter by `trace_id` to pull the whole story of one action across authorization,
        approval and outcome.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - name: subject_type
          in: query
          schema:
            type: string
            enum: [Session, SpendToken, ActionIntent, PaymentIntent, Policy, PolicyModule, Agent, Workspace, WorkspaceMembership, WorkspaceInvitation, Subscription]
        - name: subject_id
          in: query
          schema: { type: string, format: uuid }
        - name: trace_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: A page of audit events, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
