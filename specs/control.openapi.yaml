  /v1/workspaces/{workspace_slug}/payment_intents/{id}/approve:
    post:
      tags: [Approvals]
      operationId: approvePaymentIntent
      summary: Approve a held payment
      description: |
        Requires `approve`.

        This grants authority; it does not move money. The intent returns to `pending` and
