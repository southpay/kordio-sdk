  /v1/workspaces/{workspace_slug}/webhook_endpoints:
    get:
      tags: [Webhook endpoints]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: A page of endpoints. Secrets are never returned here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
    post:
      tags: [Webhook endpoints]
      operationId: createWebhookEndpoint
      summary: Create a webhook endpoint
      description: |
        Requires `manage_policy`.

        The response carries `secret` exactly once. Store it immediately; if you lose it,
        rotate the endpoint.

        An empty `enabled_events` array subscribes to **every** event type. Name the ones
        you handle instead.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: https://app.example.com/webhooks/kordio
                status:
                  type: string
                  enum: [active, disabled]
                  default: active
                enabled_events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
                  example: [action.requires_approval, approval.resolved]
      responses:
        '201':
          description: The endpoint, including its signing secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        properties:
                          secret:
                            type: string
                            description: Shown exactly once.
                            example: whsec_4bSFH1YTkjwsgiMrHMwWJfJTIzsov60WxxsziZAE
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '422':
          description: The URL is malformed, or an event name is not recognised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/webhook_endpoints/{id}:
    get:
      tags: [Webhook endpoints]
      operationId: getWebhookEndpoint
      summary: Read a webhook endpoint
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
    delete:
      tags: [Webhook endpoints]
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      description: Requires `manage_policy`.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/webhook_endpoints/{id}/rotate:
    post:
      tags: [Webhook endpoints]
      operationId: rotateWebhookEndpointSecret
      summary: Rotate a signing secret
      description: >-
        Requires `manage_policy`. Returns a new `secret`, once. The previous secret stops
