          description: The intent is not in `requires_approval`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/payment_intents/{id}/deny:
    post:
      tags: [Approvals]
      operationId: denyPaymentIntent
      summary: Deny a held payment
      description: >-
        Requires `approve`. Releases the reservation and enqueues the ledger release.
      security:
        - IdentityToken: []
