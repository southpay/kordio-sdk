            type: string
            enum: [pending, requires_approval, executed, failed, denied]
        - name: agent_mode
          in: query
          description: >-
            Narrow to intents whose agent runs in this mode. Any other value is a `400`,
            rather than a silent full listing.
          schema:
            type: string
            enum: [live, test]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: A page of payment intents.
