              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The invitation was already accepted, revoked, or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/invitations/accept:
    post:
      tags: [Members]
      operationId: acceptInvitation
      summary: Accept an invitation
      security:
        - IdentityToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '201':
          description: The membership you now hold.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspace_slug: { type: string }
                      role: { $ref: '#/components/schemas/Role' }
        '422':
          description: The invitation is no longer open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/billing:
    get:
      tags: [Billing]
      operationId: getBilling
      summary: Read plan and entitlements
      description: >-
        The current plan, subscription, entitlement usage, prepaid volume, and the plan
        catalogue. Console-facing; agents never call this.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      responses:
        '200':
          description: The billing overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingOverview'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/billing/checkout:
    post:
      tags: [Billing]
      operationId: startBillingCheckout
      summary: Start a plan checkout
      description: >-
        Requires `manage_members`. Returns a hosted checkout URL, or, if the workspace is
        already subscribed, changes the plan in place.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [sandbox, build, growth, scale, enterprise]
                email: { type: string, format: email }
      responses:
        '201':
          description: A checkout URL, or confirmation that the plan changed in place.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
                          checkout_url: { type: string, format: uri }
                          checkout_id: { type: string }
                          plan: { type: string }
                      - type: object
                        properties:
                          plan_changed: { type: boolean }
                          plan: { type: string }
                          status: { type: string }
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /v1/workspaces/{workspace_slug}/billing/packs:
    post:
      tags: [Billing]
      operationId: buyVolumePack
      summary: Buy prepaid volume
      description: Requires `manage_members`.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: integer
                  minimum: 1
                  maximum: 200
                email: { type: string, format: email }
      responses:
        '201':
          description: A checkout URL for the pack.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checkout_url: { type: string, format: uri }
                      checkout_id: { type: string }
                      units: { type: integer }
                      volume_cents: { type: integer }
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /v1/workspaces/{workspace_slug}/billing/portal:
    post:
      tags: [Billing]
      operationId: openBillingPortal
      summary: Open the billing portal
      description: Requires `manage_members`.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      responses:
        '200':
          description: A portal URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      portal_url: { type: string, format: uri }
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '422':
          description: The workspace has never been billed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/billing/cancel:
    post:
      tags: [Billing]
      operationId: cancelSubscription
      summary: Cancel the subscription
      description: >-
        Requires `manage_members`. Cancels at period end; the plan keeps entitling until
        then.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      responses:
        '200':
          description: The updated billing overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingOverview'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /v1/workspaces/{workspace_slug}/billing/refresh:
    post:
      tags: [Billing]
      operationId: refreshBilling
      summary: Re-sync billing state
      description: >-
        Requires `manage_members`. Pulls the current subscription from the billing provider
        rather than waiting for the next webhook.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
      responses:
        '200':
          description: The refreshed billing overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BillingOverview'
        '403':
          $ref: '#/components/responses/InsufficientRole'

components:

  securitySchemes:
    AgentKey:
      type: http
      scheme: bearer
      description: >-
        An agent API key, `krt_live_…` or `krt_test_…`, shown exactly once at creation.
        Kordio stores only a digest. This credential can ask for authorization and can
        never write policy.
    IdentityToken:
      type: http
      scheme: bearer
      description: >-
        An identity bearer token for a person or your backend. Capabilities are per member,
        per workspace. This credential can manage the workspace and can never authorize an
        action as an agent.

  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique per action, scoped to the agent. A replay returns the original intent and
        the original decision, at the original status, rather than reserving budget twice.
      schema:
        type: string
        example: order-4471-attempt-1
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceSlug:
      name: workspace_slug
      in: path
      required: true
      schema: { type: string }
      example: acme-procurement
    PolicyModuleName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: vendor-allowlist
    Limit:
      name: limit
      in: query
      description: Page size. Defaults to 50, clamped to 1..200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    StartingAfter:
      name: starting_after
      in: query
      description: >-
        The `id` of the last record on the previous page. An unknown or foreign id is
        ignored and returns the first page.
      schema: { type: string, format: uuid }

  responses:
    AgentUnauthorized:
      description: Missing (`runtime_key_required`) or unrecognised (`invalid_runtime_key`) agent key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Agent key is required
              code: runtime_key_required
    IdentityUnauthorized:
      description: Missing or invalid identity token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundForAgent:
      description: >-
        The record does not belong to this agent. Kordio does not confirm existence across
        a tenancy boundary, so this is a `404` rather than a `403`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WorkspaceNotFound:
      description: >-
        The workspace does not exist, or you are not a member of it. These are deliberately
        indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientRole:
      description: Your membership does not carry the capability this call requires.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Insufficient role
              code: insufficient_role
    ValidationFailed:
      description: The request was understood but cannot be applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: >-
        Too many requests. Back off per the `Retry-After` header. Agent endpoints allow
        1200 requests per minute per key; workspace endpoints allow 300.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Rate limit exceeded
              code: rate_limited

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: For humans. Do not switch on it.
            code:
              type: string
              nullable: true
              description: >-
                Stable where present, `null` otherwise. Only a defined set of failures carry
                a code.
              enum:
                - runtime_key_required
                - invalid_runtime_key
                - identity_token_required
                - invalid_identity_token
                - budget_ceiling
                - parent_budget_exhausted
                - already_consumed
                - idempotency_conflict
                - insufficient_role
                - idempotency_key_required
                - authorization_required
                - rate_limited
                - billing_unavailable
                - invalid_signature
                - identity_unavailable
                - identity_not_configured
                - mfa_required
                - email_verification_required

    ListEnvelope:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items: { type: object }
        has_more:
          type: boolean
          description: >-
            True when the page filled to the limit. A final page that exactly fills the
            limit still reports `true`; the next request returns an empty page.
        next_cursor:
          type: string
          nullable: true
          description: Pass back as `starting_after`.

    Decision:
      type: object
      required: [outcome, rule, detail, headroom]
      properties:
        outcome:
          type: string
          enum: [allowed, denied, requires_approval]
        rule:
          type: string
          nullable: true
          description: >-
            The rule that produced this outcome, `null` when allowed with nothing to
            report. Rules from the typed policy columns surface under their column name:
            `per_transaction_cap`, `velocity_cap`, `monthly_cap`, `counterparty_allowlist`,
            `approval_threshold`. Rules written in the `rules` array surface under their
            `rule_name`, defaulting to the rule kind.
          examples:
            - per_transaction_cap
            - session_budget
            - agent_scope
            - session_inactive
            - no_policy
            - not_allowlisted
            - spend_token_ceiling
        detail:
          type: object
          additionalProperties: true
          description: The numbers behind the decision, keyed by what the rule cared about.
        headroom:
          type: object
          additionalProperties: { type: integer }
          description: >-
            What is left on every limit that applied, reduced to the tightest value per
            key. Give it to your agent: one that knows it has $380 left picks a cheaper
            vendor, one that only knows it was refused retries into the same wall.
        policy_snapshot:
          type: array
          items: { type: object, additionalProperties: true }
          description: The compiled policies as they stood when this decision was made.

    ActionRequest:
      type: object
      required: [budget_id, action_type]
      properties:
        budget_id:
          type: string
          format: uuid
          description: An active session belonging to this agent.
        action_type:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          description: Lowercase, dot separated.
          example: payment.create
        resource:
          type: string
          nullable: true
          description: The counterparty or target. Matched by allowlists.
          example: acme-supplies.example
        cost_cents:
          type: integer
          minimum: 0
          default: 0
          description: Minor units. Omit or `0` for an action that spends nothing.
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Any dot path here is addressable from the condition language as `metadata.*`.
        trace_id:
          type: string
          nullable: true
          description: Yours if you have one, generated otherwise. Links the whole audit trail.

    ActionIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        budget_id: { type: string, format: uuid }
        action_type: { type: string }
        resource: { type: string, nullable: true }
        cost_cents: { type: integer }
        currency: { type: string }
        state:
          type: string
          enum: [pending, requires_approval, completed, failed, denied]
        idempotency_key: { type: string }
        trace_id: { type: string, nullable: true }
        ledger_transaction_id: { type: string, nullable: true }
        failure_reason: { type: string, nullable: true }
        resolved_by_sub:
          type: string
          nullable: true
          description: The identity that approved or denied this, when a person did.
        resolved_at: { type: string, format: date-time, nullable: true }
        decision:
          type: object
          additionalProperties: true
          nullable: true
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ActionIntentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ActionIntent'

    ActionDecisionResponse:
      type: object
      required: [data, decision]
      properties:
        data:
          $ref: '#/components/schemas/ActionIntent'
        decision:
          $ref: '#/components/schemas/Decision'
        cosignature:
          type: string
          description: >-
            A compact ES256 JWS over the authorization. Present only when the outcome is
            `allowed` and cosigning is configured; the key is absent otherwise, never
            `null`.

    PaymentIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        budget_id: { type: string, format: uuid }
        spend_token_id: { type: string, format: uuid, nullable: true }
        amount_cents: { type: integer }
        currency: { type: string }
        counterparty: { type: string, nullable: true }
        state:
          type: string
          enum: [pending, requires_approval, executed, failed, denied]
        failure_reason: { type: string, nullable: true }
        resolved_by_sub: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        idempotency_key: { type: string }
        trace_id: { type: string, nullable: true }
        ledger_transaction_id: { type: string, nullable: true }
        decision_context: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentIntentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PaymentIntent'

    PaymentDecisionResponse:
      type: object
      required: [data, decision]
      properties:
        data:
          $ref: '#/components/schemas/PaymentIntent'
        decision:
          $ref: '#/components/schemas/Decision'
        cosignature:
          type: string

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        parent_budget_id: { type: string, format: uuid, nullable: true }
        budget_cents: { type: integer }
        spent_cents: { type: integer }
        remaining_cents: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [active, exhausted, closed]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Session'

    SpendToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        budget_id: { type: string, format: uuid }
        amount_ceiling_cents: { type: integer }
        counterparty: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [issued, consumed, expired, void]
        consumed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SpendTokenEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SpendToken'

    Agent:
      type: object
      properties:
        max_budget_cents:
          type: integer
          nullable: true
          description: >-
            The largest budget this agent may open, in minor units. Set from the
            dashboard only. Null means the agent chooses its own, which is the
            default for agents created before ceilings existed.
          example: 50000
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [active, suspended, revoked]
        mode:
          type: string
          enum: [test, live]
        scopes:
          type: array
          items: { type: string }
        api_key_prefix:
          type: string
          description: The first 12 characters of the key, for identifying it in a list.
          example: krt_test_9f3
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyRule:
      type: object
      required: [kind]
      description: >-
        One rule. Every kind accepts an optional `rule_name`, echoed back as
        `decision.rule`, and an optional stable `id` assigned on write if you do not supply
        one. Every kind except `action_allowlist` accepts `action_types` to scope the rule;
        an empty array means all action types.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            - action_allowlist
            - resource_allowlist
            - cost_cap
            - spend_window
            - monthly_spend_cap
            - rate_limit
            - approval_threshold
            - condition
        rule_name:
          type: string
          description: Defaults to the kind name.
        action_types:
          type: array
          items: { type: string }
        allow:
          type: array
          items: { type: string }
          description: >-
            For `action_allowlist` and `resource_allowlist`. An empty array is a no-op, not
            a deny-all.
        max_cents:
          type: integer
          description: For `cost_cap`, `spend_window`, `monthly_spend_cap`.
        window_seconds:
          type: integer
          minimum: 1
          description: For `spend_window` and `rate_limit`.
        max_actions:
          type: integer
          minimum: 1
          description: >-
            For `rate_limit`. Counts every action, not just spend, which is what catches a
            loop that costs nothing per call.
        above_cents:
          type: integer
          description: For `approval_threshold`. Holds rather than refuses.
        effect:
          type: string
          enum: [allow, deny, require_approval]
          default: deny
          description: For `condition`.
        when:
          $ref: '#/components/schemas/ConditionExpression'

    ConditionExpression:
      type: object
      description: |
        A boolean expression over the action. Combinators are `all_of`, `any_of` and `not`,
        nestable to ten levels; an empty `all_of` or `any_of` is rejected at write time.

        A leaf is `{field, operator, value}`.

        Fields are `action_type`, `resource`, `cost_cents`, `currency`, `agent_id`,
        `agent_mode`, `budget_id`, and any `metadata.*` dot path. A missing field never
        raises; it simply fails to match. Unknown fields and operators are rejected when the
        policy is written, never when an agent is waiting.

        The ordered comparisons (`gt`, `gte`, `lt`, `lte`) are numeric. A non-numeric
        operand makes the comparison `false` rather than an error.
      properties:
        all_of:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConditionExpression'
        any_of:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConditionExpression'
        not:
          $ref: '#/components/schemas/ConditionExpression'
        field:
          type: string
          example: metadata.preapproved
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, not_in, contains, starts_with, ends_with, exists]
        value:
          description: Omitted or null for operators that do not need one.

    PolicyDraft:
      type: object
      description: The policy shape, without an agent binding. Used for previews.
      properties:
        mode:
          type: string
          enum: [blocklist, allowlist]
          default: blocklist
          description: >-
            `blocklist` permits unless a rule denies. `allowlist` inverts it: denied unless
            an `allow` rule matches, reported as `not_allowlisted`. Each allowlist policy is
            an independent gate, so attaching two means both must be satisfied. A `deny`
            still overrides an `allow`.
        per_transaction_cap_cents: { type: integer, nullable: true }
        velocity_window_seconds: { type: integer, nullable: true }
        velocity_cap_cents: { type: integer, nullable: true }
        approval_threshold_cents: { type: integer, nullable: true }
        monthly_cap_cents: { type: integer, nullable: true }
        counterparty_allowlist:
          type: array
          items: { type: string }
        imports:
          type: array
          items: { type: string }
          description: Policy module names. Their rules compile in ahead of `rules`.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'

    PolicyWrite:
      allOf:
        - type: object
          properties:
            agent_id:
              type: string
              format: uuid
              description: Required on create.
            status:
              type: string
              enum: [active, disabled]
              default: active
        - $ref: '#/components/schemas/PolicyDraft'

    Policy:
      allOf:
        - $ref: '#/components/schemas/PolicyDraft'
        - type: object
          properties:
            id: { type: string, format: uuid }
            agent_id: { type: string, format: uuid }
            status:
              type: string
              enum: [active, disabled]
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    PolicyModule:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApprovalImpact:
      type: object
      properties:
        amount_cents: { type: integer }
        currency: { type: string }
        rule:
          type: string
          nullable: true
          description: The rule that held this intent.
        executed:
          type: boolean
          description: Always false. Nothing has run yet.
        session:
          type: object
          properties:
            id: { type: string, format: uuid }
            budget_cents: { type: integer }
            spent_cents: { type: integer }
            remaining_cents: { type: integer }
            returns_on_deny_cents:
              type: integer
              description: What denying gives back to the budget.
            open_holds:
              type: integer
              description: How many other held intents compete for this same budget.
        agent:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            mode: { type: string, enum: [test, live] }
            scopes: { type: array, items: { type: string } }
        windows:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [velocity, monthly] }
              window_seconds: { type: integer, nullable: true }
              cap_cents: { type: integer }
              spent_cents: { type: integer }
              remaining_cents: { type: integer }
        spend_token:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            amount_ceiling_cents: { type: integer }
            counterparty: { type: string, nullable: true }
            expires_at: { type: string, format: date-time, nullable: true }
            single_use: { type: boolean }

    Funds:
      type: object
      properties:
        available_cents:
          type: integer
          description: Unspent budget across every active session.
        held_cents:
          type: integer
          description: Reserved by intents waiting on a person.
        committed_cents:
          type: integer
          description: Spent across active budgets, as the control layer sees it.
        ledger_committed_cents:
          type: integer
          description: Posted to the ledger.
        unprojected_cents:
          type: integer
          description: >-
            `committed_cents - ledger_committed_cents`, floored at zero. Spend the ledger
            has not caught up on yet.
        currency: { type: string }
        ledger_ready:
          type: boolean
          description: >-
            False when the ledger is disabled, the workspace has no ledger, or the call
            failed. The control-plane figures above stay correct either way.
        by_agent:
          type: array
          items:
            type: object
            properties:
              agent_id: { type: string, format: uuid }
              agent_name: { type: string }
              ledger_account: { type: string, example: "spend:7d2a6c15-3f89-4b02-9e64-8a15d7c0b3f2" }
              committed_cents: { type: integer }
              held_cents: { type: integer }
              currency: { type: string }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        action:
          type: string
          description: What happened.
          enum:
            - action.allowed
            - action.denied
            - action.requires_approval
            - action.completed
            - action.failed
            - action.simulated
            - payment_intent.allowed
            - payment_intent.denied
            - payment_intent.requires_approval
            - payment_intent.executed
            - payment_intent.failed
            - approval.granted
            - approval.denied
            - session.created
            - spend_token.issued
            - spend_token.expired
            - policy.created
            - policy.updated
            - policy_module.created
            - policy_module.updated
            - policy_module.deleted
            - agent.created
            - membership.created
            - membership.role_changed
            - membership.removed
            - invitation.created
            - invitation.revoked
            - invitation.accepted
            - workspace.created
            - billing.checkout.started
            - billing.pack.started
            - billing.plan.changed
            - billing.subscription.cancel_requested
        trace_id: { type: string, nullable: true }
        snapshot:
          type: object
          additionalProperties: true
          description: The state captured at the moment of the event.
        created_at: { type: string, format: date-time }

    WebhookEventType:
      type: string
      enum:
        - action.requires_approval
        - action.completed
        - action.failed
        - payment.requires_approval
        - payment.executed
        - payment.failed
        - approval.resolved
        - budget.low
        - spend_token.expired

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        enabled_events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [active, disabled]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Role:
      type: string
      enum: [owner, admin, member]
      default: member
      description: >-
        `owner` carries read, approve, manage_policy and manage_members. `admin` carries
        read, approve and manage_policy. `member` carries read.

    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        capabilities:
          type: array
          items:
            type: string
            enum: [read, approve, manage_policy, manage_members]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_sub: { type: string }
        email: { type: string, nullable: true }
        role:
          $ref: '#/components/schemas/Role'
        capabilities:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        status: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    CosignatureVerificationValid:
      type: object
      properties:
        valid: { type: boolean, const: true }
        reason: { type: string, nullable: true }
        intent_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        action_type: { type: string }
        resource: { type: string, nullable: true }
        amount_cents: { type: integer }
        currency: { type: string }
        expires_at: { type: string, format: date-time }

    CosignatureVerificationInvalid:
      type: object
      properties:
        valid: { type: boolean, const: false }
        reason:
          type: string
          enum:
            - malformed
            - unknown_key
            - expired
            - wrong_issuer
            - not_yet_valid
            - bad_signature
            - unknown_intent
            - already_settled
            - amount_mismatch

    BillingOverview:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether billing is wired up on this deployment.
        plan: { type: string }
        subscription:
          type: object
          nullable: true
          additionalProperties: true
        entitlements:
          type: object
          description: >-
            Per-dimension `{limit, used, remaining}` for agents, members,
            payment_authorizations, action_authorizations and gated_volume, plus
            `live_mode`, `overage_cents`, `audit_retention_days` and the period bounds.
          additionalProperties: true
        prepaid:
          type: object
          additionalProperties: true
        plans:
          type: array
          items:
            type: object
            additionalProperties: true
