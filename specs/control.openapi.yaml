      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The endpoint with its new secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        properties:
                          secret: { type: string }
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/memberships:
