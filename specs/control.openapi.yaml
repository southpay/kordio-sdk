        - name: budget_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, requires_approval, completed, failed, denied]
        - name: action_type
          in: query
          schema: { type: string }
        - name: agent_mode
          in: query
          description: >-
            Narrow to intents whose agent runs in this mode. Any other value is a `400`,
            rather than a silent full listing.
          schema:
            type: string
            enum: [live, test]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: A page of action intents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActionIntent'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/action_intents/{id}:
    get:
      tags: [Approvals]
      operationId: getActionIntent
      summary: Read an action intent
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The action intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionIntentEnvelope'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/action_intents/{id}/impact:
    get:
      tags: [Approvals]
      operationId: getActionIntentImpact
      summary: What approving this would do
      description: |
        Everything an approver needs to decide, before they click: the amount, the rule that
        held it, the budget it draws on, how much comes back if it is denied, how
        many other holds compete for the same budget, and every window it consumes.

        Budget is already reserved while an intent is held, so approving costs no further
        headroom. `returns_on_deny_cents` is what denying gives back.

        An approver who only sees "approve $2,400?" is rubber-stamping. This is the call
        that fixes that.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The impact summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalImpact'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /v1/workspaces/{workspace_slug}/action_intents/{id}/approve:
    post:
      tags: [Approvals]
      operationId: approveActionIntent
      summary: Approve a held action
      description: |
        Requires the `approve` capability.

        Moves the intent from `requires_approval` to `pending`. It does **not** execute
        anything. The agent still executes and still reports the outcome with `complete` or
        `fail`.

        Records `resolved_by_sub` and emits `approval.resolved`.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The approved intent, now `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionIntentEnvelope'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          description: The intent is not in `requires_approval`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/action_intents/{id}/deny:
    post:
      tags: [Approvals]
      operationId: denyActionIntent
      summary: Deny a held action
      description: >-
        Requires `approve`. Moves the intent to `denied` and releases the reserved budget
        back to the budget.
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Defaults to `approval_denied`.
      responses:
        '200':
          description: The denied intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionIntentEnvelope'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          description: The intent is not in `requires_approval`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/workspaces/{workspace_slug}/payment_intents:
    get:
      tags: [Approvals]
      operationId: listPaymentIntents
      summary: List payment intents
      security:
        - IdentityToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - name: agent_id
